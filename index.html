<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027届秋招情报站 · 产品/运营方向</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>🎯 2027届秋招情报站</h1>
      <p class="subtitle">产品 / 运营方向 · 聚焦上海、深圳、香港 · 数据每日更新</p>
      <p class="updated">最后更新：<span id="lastUpdated">加载中…</span></p>
    </div>
  </header>

  <nav class="tabs container" id="tabs">
    <button class="tab active" data-tab="companies">📋 公司名单</button>
    <button class="tab" data-tab="timeline">🗓️ 秋招时间线</button>
    <button class="tab" data-tab="compare">📊 对比表格</button>
    <button class="tab" data-tab="windows">⏰ 投递窗口建议</button>
    <button class="tab" data-tab="city">🏙️ 城市机会</button>
  </nav>

  <main class="container">
    <!-- 公司名单 -->
    <section id="panel-companies" class="panel active">
      <div class="filters">
        <div class="filter-group" id="categoryFilters">
          <button class="chip active" data-cat="all">全部</button>
          <button class="chip" data-cat="互联网大厂">互联网大厂</button>
          <button class="chip" data-cat="世界500强外企">世界500强外企</button>
          <button class="chip" data-cat="新能源车企">新能源车企</button>
        </div>
        <div class="filter-group" id="cityFilters">
          <button class="chip city active" data-city="all">全部城市</button>
          <button class="chip city" data-city="上海">上海</button>
          <button class="chip city" data-city="深圳">深圳</button>
          <button class="chip city" data-city="香港">香港</button>
        </div>
        <input type="search" id="searchBox" placeholder="🔍 搜索公司名…">
      </div>
      <p class="notice" id="notice"></p>
      <div id="companyList" class="card-grid"></div>
    </section>

    <!-- 时间线 -->
    <section id="panel-timeline" class="panel">
      <div class="timeline" id="timelineList"></div>
    </section>

    <!-- 对比表格 -->
    <section id="panel-compare" class="panel">
      <div class="table-wrap">
        <table id="compareTable">
          <thead>
            <tr>
              <th>公司</th><th>类别</th><th>状态</th><th>开启时间</th>
              <th>截止时间</th><th>投递渠道</th><th>薪资范围</th><th>城市</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 投递窗口 -->
    <section id="panel-windows" class="panel">
      <div id="windowList" class="window-list"></div>
    </section>

    <!-- 城市机会 -->
    <section id="panel-city" class="panel">
      <div id="cityList" class="city-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>数据由 WorkBuddy 每日自动调研更新 · 信息仅供参考，投递前请以各公司官方招聘网站为准</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
