<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027届秋招发车榜 · 产品/运营方向</title>
  <meta name="description" content="2027届秋季校园招聘时刻表：互联网大厂、500强外企、新能源车企的开启时间、截止日期与官方投递直达，聚焦上海、深圳、香港。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 签名元素：秋招发车榜（车站时刻表） -->
  <header class="board">
    <div class="container">
      <div class="board-top">
        <div>
          <p class="board-eyebrow">CAMPUS 2027 · 产品 / 运营</p>
          <h1>秋招发车榜</h1>
          <p class="board-sub">错过一班，等一年。上海 · 深圳 · 香港</p>
        </div>
        <div class="board-clock">
          <span class="clock-label">数据更新于</span>
          <span class="clock-time" id="lastUpdated">— — —</span>
        </div>
      </div>

      <div class="departures" id="departures" aria-label="正在检票的招聘批次">
        <div class="dep-head" aria-hidden="true">
          <span>车次 / 公司</span><span>批次</span><span>检票状态</span><span>截止</span><span></span>
        </div>
        <!-- JS 渲染：正在检票（已开启）的公司行 -->
      </div>
      <p class="board-note" id="notice"></p>
    </div>
  </header>

  <nav class="tabs container" id="tabs">
    <button class="tab active" data-tab="companies">公司名单</button>
    <button class="tab" data-tab="timeline">秋招时刻表</button>
    <button class="tab" data-tab="compare">对比总表</button>
    <button class="tab" data-tab="windows">投递窗口</button>
    <button class="tab" data-tab="city">城市站台</button>
  </nav>

  <main class="container">
    <!-- 公司名单 -->
    <section id="panel-companies" class="panel active">
      <div class="filters">
        <div class="filter-group" id="categoryFilters">
          <button class="chip active" data-cat="all">全部</button>
          <button class="chip" data-cat="互联网大厂">互联网大厂</button>
          <button class="chip" data-cat="世界500强外企">500强外企</button>
          <button class="chip" data-cat="新能源车企">新能源车企</button>
        </div>
        <div class="filter-group" id="cityFilters">
          <button class="chip city active" data-city="all">全部城市</button>
          <button class="chip city" data-city="上海">上海</button>
          <button class="chip city" data-city="深圳">深圳</button>
          <button class="chip city" data-city="香港">香港</button>
        </div>
        <input type="search" id="searchBox" placeholder="搜索公司名…" aria-label="搜索公司名">
      </div>
      <div id="companyList" class="card-grid"></div>
    </section>

    <!-- 时间线 -->
    <section id="panel-timeline" class="panel">
      <div class="timeline" id="timelineList"></div>
    </section>

    <!-- 对比表格 -->
    <section id="panel-compare" class="panel">
      <p class="table-hint">点击任意一行，前往该公司官方投递页。</p>
      <div class="table-wrap">
        <table id="compareTable">
          <thead>
            <tr>
              <th>公司</th><th>类别</th><th>状态</th><th>开启时间</th>
              <th>截止时间</th><th>薪资范围</th><th>城市</th><th>投递</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 投递窗口 -->
    <section id="panel-windows" class="panel">
      <div id="windowList" class="window-list"></div>
    </section>

    <!-- 城市机会 -->
    <section id="panel-city" class="panel">
      <div id="cityList" class="city-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>数据每日自动调研更新 · 信息仅供参考，投递前请以各公司官方招聘网站为准</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
